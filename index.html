<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="내 주변 편의점 간편결제 할인 혜택을 비교하세요.">
  <title>페이픽 | 내 주변 결제 할인</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="페이픽 홈"><span>Pay</span>Pick</a>
    <button id="locationButton" class="location-button" type="button" aria-describedby="locationStatus">
      <span aria-hidden="true">⌖</span> 내 위치 찾기
    </button>
  </header>

  <main>
    <section class="hero" aria-labelledby="pageTitle">
      <p class="eyebrow">오늘 어디서 결제할까요?</p>
      <h1 id="pageTitle">가까운 편의점의<br><strong>결제 할인</strong>을 한눈에.</h1>
      <p id="locationStatus" class="location-status" aria-live="polite">경희대부터 한국외대·회기역·외대앞역까지 데모 혜택을 보여드려요.</p>
    </section>

    <section class="filters" aria-labelledby="filterTitle">
      <div class="section-heading">
        <h2 id="filterTitle">결제 수단</h2>
        <button id="resetButton" class="text-button" type="button">전체 보기</button>
      </div>
      <div id="payFilters" class="pay-filters" role="group" aria-label="결제 수단 필터"></div>
    </section>

    <section class="results" aria-labelledby="resultTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">NEARBY BENEFITS</p>
          <h2 id="resultTitle">주변 혜택 <span id="resultCount">0</span></h2>
        </div>
        <div class="result-actions">
          <div class="view-toggle" role="group" aria-label="보기 방식">
            <button class="view-button" type="button" data-view="map" aria-pressed="true">지도</button>
            <button class="view-button" type="button" data-view="list" aria-pressed="false">리스트</button>
          </div>
          <label class="sort-label">정렬
            <select id="sortSelect">
              <option value="distance">가까운 순</option>
              <option value="discount">할인 높은 순</option>
            </select>
          </label>
        </div>
      </div>
      <div id="mapView" class="map-view">
        <div class="map-search" aria-hidden="true"><span>⌕</span> 경희대 · 한국외대 · 회기역 · 외대앞역</div>
        <button id="recenterButton" class="map-recenter" type="button" aria-label="전체 서비스 영역 보기">◎</button>
        <div id="map" aria-label="경희대학교 주변 편의점 할인 지도"></div>
        <aside id="mapStoreCard" class="map-store-card" aria-live="polite" hidden></aside>
      </div>
      <div id="benefitList" class="benefit-list" hidden></div>
      <div id="emptyState" class="empty-state" hidden>
        <p>조건에 맞는 혜택이 없어요.</p>
        <button type="button" class="primary-button">필터 초기화</button>
      </div>
    </section>
  </main>

  <template id="benefitTemplate">
    <article class="benefit-card">
      <div class="store-logo" aria-hidden="true"></div>
      <div class="card-content">
        <div class="card-topline"><span class="store-name"></span><span class="distance"></span></div>
        <p class="address"></p>
        <div class="offer-row">
          <span class="pay-badge"></span>
          <p><strong class="discount"></strong><span> 할인</span></p>
        </div>
        <p class="condition"></p>
      </div>
    </article>
  </template>

  <p class="notice">현재 표시된 혜택은 MVP용 예시 데이터이며 실제 매장 프로모션과 다를 수 있어요.</p>
  <script src="config.js"></script>
  <script>
    const kakaoMapScript = document.createElement('script');
    kakaoMapScript.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${window.KAKAO_MAP_KEY || ''}&autoload=false`;
    kakaoMapScript.onload = () => window.dispatchEvent(new Event('kakao-sdk-ready'));
    document.head.append(kakaoMapScript);
  </script>
  <script src="app.js"></script>
</body>
</html>
